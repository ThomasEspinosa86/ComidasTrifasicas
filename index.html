<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
    <title>Document</title>
    <script src="app.js" defer></script>
</head>
<body><header>
    <nav class="barra-nav">

        <!-- Estructura del nav -->

        <!-- Menú hamburguesa -->
        <div class="contenedor-nav-haburguesa">
            <button type="button" aria-label="Abrir menú">
                ☰
            </button>

            <div class="menu-hamburguesa">
                <a href="#productos">Productos</a>
                <a href="#contactanos">Contáctanos</a>
                <a href="#sobreNosotros">Sobre nosotros</a>
            </div>

            <div class="carrito-icono">
                <img src="" alt="Carrito de compras">
                <span>0</span>
            </div>
        </div>

        <!-- Logo -->
        <a href="#" aria-label="Inicio">
            <img src="" alt="Logo">
        </a>

        <!-- Barra de búsqueda -->
         <div class="contenedor-barra-busqueda">
             <form id="formularioBusqueda" role="search">
                <input
                    class="form-control"
                    type="search"
                    id="buscador"
                    placeholder="¿Qué quieres comer?"
                    aria-label="Buscar productos"
                    aria-autocomplete="list"
                    aria-controls="sugerencias"
                    autocomplete="off"
                >
            </form>

            <!-- Sugerencias del buscador -->
            <div
                id="sugerencias"
                class="list-group sugerencias"
            ></div>
        </div>
        

        <!-- Navegación para dispositivos mayores a 768px -->
        <div class="contenedor-nav">
            <a href="#productos">Productos</a>
            <a href="#contactanos">Contáctanos</a>
            <a href="#sobreNosotros">Sobre nosotros</a>

            <div class="resumen-carrito">
                <img src="" alt="" class="icono-carrito">
                <span class="precio-carrito" id="precio-carrito">$0</span>
                <span class="cantidad-carrito" id="cantidad-carrito-desktop">(0)</span>
            </div>
        </div>

        
    </nav>
</header>
    <main><!--slider galeria visual de un par de productos-->

    </main>
    
    <section id="productos">
  <div class="container">
    <h2 class="text-center mb-4">Nuestro menú</h2>

    <nav class="menu-categorias" aria-label="Categorías del menú">
      <button class="btn-categoria active" data-categoria="todos">Todos</button>
      <button class="btn-categoria" data-categoria="entrada">Entrada</button>
      <button class="btn-categoria" data-categoria="platos-fuertes">Platofuerte</button>
      <button class="btn-categoria" data-categoria="postres">Postre</button>
    </nav>

    <div id="catalogo" class="row g-4 mt-2"></div>
  </div>
</section>
    <section id="contactanos"><!--formulario-->

        <form action=""></form>
    </section>
    <section id="sobreNosotros"></section>
    <footer><!-- aqui puedes poner una lista y si queres img dentro de la lista podes hacerlo-->

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
