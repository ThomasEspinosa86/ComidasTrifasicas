<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header>
        <nav><!--estrucutura del nav-->
            <img src="" alt="">
            <a href="#productos">Productos</a>
            <a href="#contactanos">contactanos</a><!--  <->   -->
            <a href="#sobreNosotros">Sobre nosotros</a>
            
            <img src="" alt=""></img>
        </nav>
    </header>
    <main><!--slider galeria visual de un par de productos-->

    </main>
    <section id="productos--"><!-- plato fuerte[{},{},{}], entradas[{},{},{}], postres[{},{},{}].
        se cargaran los elementos con JS del catalogo de productos tarjeticas-->

    </section>
    <section id="contactanos"><!--formulario->Andres Florez-->
        <form action="">
            <!-- Div de nombre completo -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingresa tu nombre">
            </div>

            <!-- Div de correo electronico -->
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electronico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">
            </div>

            <!-- Div de Numero de contacto -->
            <div class="mb-3">
                <label for="telefono" class="form-label">Numero de contacto</label>
                <input type="tel" class="telefono" id="telefono" placeholder="Tu numero de telefono">
            </div>

            <!-- Div de Motivo de contacto con sus opciones -->
             <div class="mb-3">
                <label for="motivo" class="form-label">Motivo de contacto</label>
                <select class="form-select" name="motivo" id="motivo">
                    <option value="" selected disabled>Seleciona un motivo</option>
                    <option value="informacion">Informacion general</option>
                    <option value="problemas">Problemas con la plataforma</option>
                    <option value="cuenta">Ayudo con mi cuenta</option>
                    <option value="negocios">Informacion para restaurantes o negocios</option>
                    <option value="otros">Otros</option>
                </select>
             </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea name="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Cuentanos en que podemos ayudarte"></textarea>
            </div>

            <!-- Div de politica de datos-->
            <div class="form-check mb-3">
                <input class="form-check-input" type="text" id="politica" name="politica">
                <label class="form-check-label" for="politica">
                    Acepto la politica de tratamiento de datos personales.
                </label>
            </div>
        </form>
    </section>
    <section id="sobreNosotros"></section>
    <footer><!-- aqui puedes poner una lista y si queres img dentro de la lista podes hacerlo-->

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
